name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    # 单元测试只依赖 lib/pure.js（零第三方依赖），无需 npm install，
    # 规避 npm registry 上 @deepseek-ai/* 各 rc 包之间的 peer 版本冲突。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check lib/index.js
          node --check lib/pure.js
          node --check test/unit.mjs
          node --check test/integration.mjs
          node --check scripts/smoke-test.mjs
          node --check mcp/fetch-server/server.mjs
      - name: Unit tests
        run: node test/unit.mjs

  install-smoke:
    # 仅验证直接依赖（qrcode / wechat-ilink-client）可在全新环境安装。
    # 宿主 peer（@deepseek-ai/*）由 DSH 运行时提供，这里用 legacy-peer-deps 跳过，
    # --ignore-scripts 跳过针对本机 DSH 安装目录的 junction 脚本（CI 无 DSH）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
